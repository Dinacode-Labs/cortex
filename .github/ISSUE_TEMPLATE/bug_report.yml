name: Bug
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ¿Es un problema de **seguridad**? No lo reportes aquí: sigue [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: Qué pasa
      description: Qué esperabas y qué ocurre en su lugar.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Cómo reproducirlo
      description: Los pasos mínimos. Si hay un error, pégalo entero.
      placeholder: |
        1. `cortex link --create "..."`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión
      description: Salida de `cortex --version`, o el commit si vas desde el repo.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Entorno
      description: |
        SO, versión de Node, agente (Claude Code, Codex, OpenCode, Hermes) y, si viene al caso,
        el proveedor de LLM/embeddings configurado. **No pegues claves.**
