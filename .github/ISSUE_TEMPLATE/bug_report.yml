name: Bug
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Is this a **security** problem? Do not report it here: follow [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you expected, and what happens instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The minimum steps. If there is an error, paste the whole thing.
      placeholder: |
        1. `cortex link --create "..."`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `cortex --version`, or the commit if you run from the repo.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: |
        OS, Node version, agent (Claude Code, Codex, OpenCode, Hermes) and, where it matters,
        the LLM/embeddings provider you have configured. **Do not paste keys.**
