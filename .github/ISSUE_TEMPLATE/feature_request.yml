name: Proposal
description: Suggest a capability or a change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem it solves
      description: Start from the problem, not from the solution. What you were trying to do, and what you ran into.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including "do nothing". It helps weigh whether this is worth it.
