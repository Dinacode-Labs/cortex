# Automatic updates. The point is to find out early, not to merge blindly:
# these PRs go through the same CI as any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Grouped: one PR a week instead of twenty.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # zod lives in two versions on purpose (v3 across the repo, v4 in agents because Mastra
      # requires it; ADR-0008). An automatic bump would break that balance.
      - dependency-name: "zod"
    # Careful: `xlsx` installs from SheetJS's CDN by URL and Dependabot does NOT follow
    # tarballs. It has to be reviewed by hand every quarter (see SECURITY.md).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
