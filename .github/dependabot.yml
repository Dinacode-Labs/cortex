# Actualizaciones automáticas. El objetivo es enterarse pronto, no fusionar a ciegas:
# los PRs pasan el mismo CI que cualquier otro cambio.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Agrupadas: un PR semanal en vez de veinte.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # zod convive en dos versiones a propósito (v3 en todo el repo, v4 en agents porque lo
      # exige Mastra; ADR-0008). Un bump automático rompería ese equilibrio.
      - dependency-name: "zod"
    # OJO: `xlsx` se instala desde el CDN de SheetJS por URL y Dependabot NO sigue tarballs.
    # Hay que revisarlo a mano cada trimestre (ver SECURITY.md).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
