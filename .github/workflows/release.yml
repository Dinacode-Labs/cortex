# Publishes a release: verifies, builds the image, publishes the CLI to npm and creates the
# GitHub Release.
#
#   node scripts/set-version.mjs 0.2.0
#   git commit -am "chore(release): v0.2.0" && git tag v0.2.0
#   git push origin main v0.2.0
#
# The tag is both the trigger and the source of truth; `verify` checks it matches what the
# package.json files say, because a tag that does not line up with the published version is an
# hour lost by somebody six months from now.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
          POSTGRES_DB: cortex_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cortex -d cortex_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      CORTEX_TEST_DATABASE_URL: postgres://cortex:cortex@localhost:5433/cortex_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }

      - name: The tag matches the repo's version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          CLI=$(node -p "require('./apps/cli/package.json').version")
          PLUGIN=$(node -p "require('./plugin/claude-code/.claude-plugin/plugin.json').version")
          echo "tag=$TAG root=$PKG cli=$CLI plugin=$PLUGIN"
          test "$TAG" = "$PKG" && test "$TAG" = "$CLI" && test "$TAG" = "$PLUGIN" \
            || { echo "::error::tag and versions do not match; use scripts/set-version.mjs"; exit 1; }
          node scripts/changelog-notes.mjs "$TAG" > /dev/null \
            || { echo "::error::CHANGELOG.md has no section for $TAG"; exit 1; }

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm --filter @dinacodelabs/cortex build

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cortex
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  # Only runs if the token exists. Without it the Release and the image still go out, and the
  # warning step says so out loud instead of leaving a half-published release unnoticed.
  npm:
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Dinacode-Labs' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # The CLI bundle is assembled from the monorepo packages' `dist/`, so they have to be
      # compiled first. `verify` already does it, but that is ANOTHER job with its own
      # checkout: nothing is built here. Without this, tsup cannot resolve `@cortex/client`
      # and the release dies after the image has already been published.
      - run: pnpm build
      - name: Publish @dinacodelabs/cortex
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: pnpm --filter @dinacodelabs/cortex publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Warn when the token is missing
        if: ${{ env.NODE_AUTH_TOKEN == '' }}
        run: echo "::warning::The NPM_TOKEN secret is missing; the CLI was not published to npm."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: [image, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Release notes from the CHANGELOG
        run: node scripts/changelog-notes.mjs "${GITHUB_REF_NAME#v}" > /tmp/notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/notes.md
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
