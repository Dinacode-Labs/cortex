name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
          POSTGRES_DB: cortex_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U cortex -d cortex_test"
          --health-interval 5s --health-timeout 5s --health-retries 15

    env:
      # Test database (the service maps 5432 to the host's 5433); local embeddings / LLM none.
      CORTEX_TEST_DATABASE_URL: postgres://cortex:cortex@localhost:5433/cortex_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # reads packageManager from package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (real Postgres)
        run: pnpm test:integration

      - name: Build (tsc -b)
        run: pnpm build

      # Compiling is not enough: the JS in dist has to actually START. The typical failures
      # here are paths to data files (migrations, static assets) that resolved fine from src
      # and not from dist, and neither typecheck nor the tests catch them.
      - name: Build smoke test
        run: |
          node -e "
            const { existsSync } = require('node:fs');
            const { resolve } = require('node:path');
            const must = [
              'packages/shared/dist/index.js',
              'packages/database/dist/migrate-cli.js',
              'apps/server/dist/index.js',
              'apps/web/dist/index.js',
              'apps/mcp-server/dist/http.js',
            ];
            for (const f of must) if (!existsSync(f)) { console.error('missing', f); process.exit(1); }
            // Data files resolved relative to the compiled output.
            const paths = [
              ['migrations', resolve('packages/database/dist', '../migrations')],
              ['web static assets', resolve('apps/web/dist', '../public')],
              ['install.sh', resolve('apps/server/dist/routes', '../../../../scripts/install.sh')],
            ];
            for (const [name, p] of paths) if (!existsSync(p)) { console.error('does not resolve from dist:', name, p); process.exit(1); }
            console.log('dist complete and data paths correct');
          "
          node -e "import('./apps/server/dist/app.js').then(m => { if (typeof m.createApp !== 'function') { console.error('createApp not exported'); process.exit(1); } console.log('the compiled app loads'); })"

      # The CLI ships to npm as a bundle, not through `tsc`, so its build is separate. What
      # gets checked is what breaks a publish: that it starts, that no `import.meta.dirname`
      # slipped in (the bundle is flat and does not resolve repo paths), that neither Postgres
      # nor Mastra came along through a careless import, and that `npm pack` does not complain.
      - name: CLI bundle
        run: |
          pnpm --filter @dinacodelabs/cortex build
          node apps/cli/dist/cortex.js --help > /dev/null
          test "$(node apps/cli/dist/cortex.js --version)" = "$(node -p "require('./apps/cli/package.json').version")"
          ! grep -q "import.meta.dirname" apps/cli/dist/cortex.js
          ! grep -qE '"postgres"|@mastra/|mammoth' apps/cli/dist/cortex.js
          node -e "
            const { statSync } = require('node:fs');
            const kb = statSync('apps/cli/dist/cortex.js').size / 1024;
            console.log('bundle: ' + kb.toFixed(0) + ' KB');
            if (kb > 1024) { console.error('the bundle went past 1 MB: something heavy slipped in'); process.exit(1); }
          "
          cd apps/cli && npm pack --dry-run

      # The image is what gets deployed: building it here avoids finding out on the server
      # that a data file is missing or that one multi-stage step was left behind. The GitHub
      # Actions cache only works with the docker-container driver, which is what
      # setup-buildx-action installs; without it, buildx fails with "Cache export is not
      # supported for the docker driver".
      - uses: docker/setup-buildx-action@v4

      - name: Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Informational on purpose, not blocking: today there are high TRANSITIVE
      # vulnerabilities in mammoth, the MCP SDK and Mastra that we cannot fix until they
      # publish. A gate that fails from day one ends up being switched off and stops meaning
      # anything; this keeps it visible on every build and Dependabot opens the PRs. See
      # SECURITY.md.
      - name: Dependency audit (informational)
        run: pnpm audit --prod --audit-level=high || true
