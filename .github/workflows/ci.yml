name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
          POSTGRES_DB: cortex_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U cortex -d cortex_test"
          --health-interval 5s --health-timeout 5s --health-retries 15

    env:
      # BD de test (el service expone 5432 en el 5433 del host); embeddings local / LLM none.
      CORTEX_TEST_DATABASE_URL: postgres://cortex:cortex@localhost:5433/cortex_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6 # lee packageManager del package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (Postgres real)
        run: pnpm test:integration

      - name: Build (tsc -b)
        run: pnpm build

      # Que compile no basta: hay que comprobar que el JS de dist ARRANCA. Los fallos
      # típicos aquí son rutas a ficheros de datos (migraciones, estáticos) que resolvían
      # bien desde src y no desde dist, y no los detecta ni el typecheck ni los tests.
      - name: Smoke del build
        run: |
          node -e "
            const { existsSync } = require('node:fs');
            const { resolve } = require('node:path');
            const must = [
              'packages/shared/dist/index.js',
              'packages/database/dist/migrate-cli.js',
              'apps/server/dist/index.js',
              'apps/web/dist/index.js',
              'apps/mcp-server/dist/http.js',
            ];
            for (const f of must) if (!existsSync(f)) { console.error('falta', f); process.exit(1); }
            // Ficheros de datos que se resuelven relativos al compilado.
            const paths = [
              ['migraciones', resolve('packages/database/dist', '../migrations')],
              ['estáticos web', resolve('apps/web/dist', '../public')],
              ['install.sh', resolve('apps/server/dist/routes', '../../../../scripts/install.sh')],
            ];
            for (const [name, p] of paths) if (!existsSync(p)) { console.error('no resuelve desde dist:', name, p); process.exit(1); }
            console.log('dist completo y rutas de datos correctas');
          "
          node -e "import('./apps/server/dist/app.js').then(m => { if (typeof m.createApp !== 'function') { console.error('createApp no exportado'); process.exit(1); } console.log('la app compilada carga'); })"

      # El CLI se publica en npm como un bundle, no con `tsc`, así que su build es aparte.
      # Lo que se comprueba es lo que rompe una publicación: que arranca, que no se ha colado
      # `import.meta.dirname` (el bundle es plano y no resuelve rutas del repo), que no ha
      # entrado Postgres ni Mastra por un import descuidado, y que `npm pack` no se queja.
      - name: Empaquetado del CLI
        run: |
          pnpm --filter @dinacodelabs/cortex build
          node apps/cli/dist/cortex.js --help > /dev/null
          test "$(node apps/cli/dist/cortex.js --version)" = "$(node -p "require('./apps/cli/package.json').version")"
          ! grep -q "import.meta.dirname" apps/cli/dist/cortex.js
          ! grep -qE '"postgres"|@mastra/|mammoth' apps/cli/dist/cortex.js
          node -e "
            const { statSync } = require('node:fs');
            const kb = statSync('apps/cli/dist/cortex.js').size / 1024;
            console.log('bundle: ' + kb.toFixed(0) + ' KB');
            if (kb > 1024) { console.error('el bundle ha pasado de 1 MB: algo pesado se ha colado'); process.exit(1); }
          "
          cd apps/cli && npm pack --dry-run

      # La imagen es la que se despliega: que compile aquí evita descubrir en el servidor
      # que falta un fichero de datos o que una etapa del multi-stage se quedó atrás.
      # La caché de GitHub Actions solo funciona con el driver docker-container, que es lo
      # que instala setup-buildx-action; sin esto, buildx falla con "Cache export is not
      # supported for the docker driver".
      - uses: docker/setup-buildx-action@v3

      - name: Imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Informativo a propósito, no bloqueante: hoy hay vulnerabilidades altas TRANSITIVAS
      # en mammoth, el SDK de MCP y Mastra que no podemos arreglar hasta que publiquen. Un
      # gate que falla desde el primer día se acaba desactivando y deja de aportar nada;
      # esto lo deja visible en cada build y Dependabot abre los PRs. Ver SECURITY.md.
      - name: Auditoría de dependencias (informativa)
        run: pnpm audit --prod --audit-level=high || true
