# Cortex's local infrastructure.
# For now only Postgres with the pgvector extension (documental + vectorial storage in a
# single database, per the demo's hypothesis). A dedicated graph (Neo4j/Memgraph) or a
# dedicated vector DB (Qdrant) are alternatives to evaluate in later phases; see
# docs/decisions.md.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    ports:
      - "5433:5432"
    volumes:
      - cortex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cortex-pgdata:
