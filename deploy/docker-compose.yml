# Despliegue de Dinacode Cortex: Postgres + migraciones + servidor (API/auth) + UI web +
# MCP HTTP + worker de mantenimiento. Una sola imagen, un comando por servicio.
#   cp deploy/.env.example deploy/.env   # y edítalo (secretos, dominio, proveedores)
#   docker compose -f deploy/docker-compose.yml up -d --build
name: cortex

x-cortex: &cortex
  build:
    context: ..
    dockerfile: Dockerfile
  image: dinacode-cortex:latest
  env_file: [.env]
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cortex}
      POSTGRES_DB: ${POSTGRES_DB:-cortex}
    volumes:
      - cortex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex} -d ${POSTGRES_DB:-cortex}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Aplica migraciones una vez (los demás esperan a que termine OK).
  migrate:
    <<: *cortex
    command: pnpm db:migrate
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  server:
    <<: *cortex
    command: pnpm --filter @cortex/server start
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports: ["${CORTEX_SERVER_PORT:-8787}:8787"]

  web:
    <<: *cortex
    command: pnpm --filter @cortex/web start
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports: ["8080:8080"]

  mcp:
    <<: *cortex
    command: pnpm --filter @cortex/mcp-server run start:http
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports: ["8788:8788"]

  worker:
    <<: *cortex
    command: pnpm --filter @cortex/agents run maintain:worker
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  cortex-pgdata:
