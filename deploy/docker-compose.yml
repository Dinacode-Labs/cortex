# Cortex deployed on a single host: Caddy (TLS) → web / API / MCP, with Postgres and a
# maintenance worker behind them, plus daily backups.
#
#   cp deploy/.env.example deploy/.env    # and edit it: domain, passwords, providers
#   docker compose -f deploy/docker-compose.yml up -d
#
# The image comes from GHCR; `--build` is only needed to try out local changes. The project
# is ISOLATED from the development compose (which is called "cortex"), so its volume never
# collides with the dev one nor gets taken out by a `down -v`.
name: cortex-deploy

x-app: &app
  image: ${CORTEX_IMAGE:-ghcr.io/dinacode-labs/cortex}:${CORTEX_VERSION:-latest}
  build:
    context: ..
    dockerfile: Dockerfile
  env_file: [.env]
  environment:
    NODE_ENV: production
    # Inside the container it does listen on every interface: the only thing publishing
    # ports to the outside is Caddy.
    CORTEX_BIND_HOST: 0.0.0.0
  restart: unless-stopped
  networks: [internal]
  depends_on:
    postgres: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

services:
  # The only service with published ports. It requests and renews the certificate on its own.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      CORTEX_DOMAIN: ${CORTEX_DOMAIN:?CORTEX_DOMAIN is missing from deploy/.env}
      CORTEX_ACME_EMAIL: ${CORTEX_ACME_EMAIL:?CORTEX_ACME_EMAIL is missing from deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # certificates: losing them means asking again (there are rate limits)
      - caddy-config:/config
    networks: [internal]
    depends_on: [server, web, mcp]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing from deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-cortex}
    volumes:
      - cortex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex} -d ${POSTGRES_DB:-cortex}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks: [internal]   # no `ports`: the database does not face the internet

  # Applies migrations once and exits. The rest wait for it to finish cleanly.
  migrate:
    <<: *app
    command: node packages/database/dist/migrate-cli.js
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  server:
    <<: *app
    command: node apps/server/dist/index.js
    environment:
      NODE_ENV: production
      CORTEX_BIND_HOST: 0.0.0.0
      HEALTH_PORT: "8787"

  web:
    <<: *app
    command: node apps/web/dist/index.js
    environment:
      NODE_ENV: production
      CORTEX_BIND_HOST: 0.0.0.0
      HEALTH_PORT: "8080"

  mcp:
    <<: *app
    command: node apps/mcp-server/dist/http.js
    environment:
      NODE_ENV: production
      CORTEX_BIND_HOST: 0.0.0.0
      HEALTH_PORT: "8788"

  # It listens on no port, so its health is measured by the heartbeat file: without it, a
  # hung worker looks healthy from the outside.
  worker:
    <<: *app
    command: node apps/admin/dist/index.js maintain-worker
    environment:
      NODE_ENV: production
      CORTEX_WORKER_HEARTBEAT_FILE: /tmp/cortex-worker.heartbeat
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const{statSync}=require('node:fs');process.exit(Date.now()-statSync('/tmp/cortex-worker.heartbeat').mtimeMs<120000?0:1)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # A daily dump. `--blobs` and no `--schema=public` so the dump includes the vector
  # extension: restoring without it leaves a database that will not start.
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing from deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-cortex}
      POSTGRES_EXTRA_OPTS: "-Z1 --blobs"
      SCHEDULE: "@daily"
      BACKUP_ON_START: "TRUE"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - cortex-backups:/backups
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }

networks:
  internal:

volumes:
  cortex-pgdata:
  cortex-backups:
  caddy-data:
  caddy-config:
