# Cortex on your machine, to try it out. This is NOT a production deployment: that is
# deploy/docker-compose.yml, which adds TLS, backups and healthchecks.
#
#   docker compose -f local.yml up -d
#   cortex auth login --server http://localhost:8787
#
# Everything listens on 127.0.0.1 ONLY and nothing is exposed to the network. That is why
# sign-up can be left open here, with a fixed password: nobody else can reach it. The moment
# you put this on a network, use the other compose file.
#
# Data survives a restart (the `cortex-local-pgdata` volume), as it should: a project memory
# only shows its worth once it has been accumulating for weeks.
name: cortex-local

x-app: &app
  image: ${CORTEX_IMAGE:-ghcr.io/dinacode-labs/cortex}:${CORTEX_VERSION:-latest}
  # If you cloned the repo and would rather build it yourself, add --build.
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &env
    NODE_ENV: production
    CORTEX_BIND_HOST: 0.0.0.0
    DATABASE_URL: postgres://cortex:cortex-local@postgres:5432/cortex

    # The access code is printed to the server log instead of being emailed:
    #   docker compose -f local.yml logs server | grep -oE '[0-9]{6}' | tail -1
    CORTEX_EMAIL_PROVIDER: log
    # Empty = any email can sign up. Acceptable ONLY because this never leaves your
    # machine.
    CORTEX_AUTH_DOMAIN: ""

    CORTEX_PUBLIC_URL: http://localhost:8787
    CORTEX_SERVER_URL: http://localhost:8787
    CORTEX_WEB_URL: http://localhost:8080
    CORTEX_MCP_PUBLIC_URL: http://localhost:8788/mcp

    # Embeddings with no keys. They are NOT semantic: they are good for getting started and
    # for the tests, not for judging search quality. For that, point EMBEDDINGS_* at a real
    # endpoint.
    EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-local}
    EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
    EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
    EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
    EMBEDDINGS_DIM: ${EMBEDDINGS_DIM:-}

    # With no model the 8 tools work and you can save and search by hand, but automatic
    # session capture produces nothing: distilling a conversation is what the model does.
    # Two ways to give it one, both without touching this file:
    #
    #   Ollama on your machine:
    #     LLM_PROVIDER=openai-compatible LLM_ALLOW_NO_KEY=1 \
    #     LLM_BASE_URL=http://host.docker.internal:11434/v1 LLM_MODEL=llama3.1 \
    #     docker compose -f local.yml up -d
    #
    #   Any OpenAI-compatible endpoint:
    #     LLM_PROVIDER=openai-compatible LLM_BASE_URL=https://… LLM_API_KEY=… LLM_MODEL=… \
    #     docker compose -f local.yml up -d
    LLM_PROVIDER: ${LLM_PROVIDER:-none}
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_ALLOW_NO_KEY: ${LLM_ALLOW_NO_KEY:-}
  networks: [internal]
  depends_on:
    postgres: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex-local
      POSTGRES_DB: cortex
    volumes:
      - cortex-local-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks: [internal]

  migrate:
    <<: *app
    command: node packages/database/dist/migrate-cli.js
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  server:
    <<: *app
    command: node apps/server/dist/index.js
    environment:
      <<: *env
      HEALTH_PORT: "8787"
    ports: ["127.0.0.1:8787:8787"]

  web:
    <<: *app
    command: node apps/web/dist/index.js
    environment:
      <<: *env
      HEALTH_PORT: "8080"
    ports: ["127.0.0.1:8080:8080"]

  mcp:
    <<: *app
    command: node apps/mcp-server/dist/http.js
    environment:
      <<: *env
      HEALTH_PORT: "8788"
    ports: ["127.0.0.1:8788:8788"]

# No `worker`: maintenance runs overnight and adds nothing to a trial. No `backup`: that is
# what the production compose file is for.
networks:
  internal:

volumes:
  cortex-local-pgdata:
